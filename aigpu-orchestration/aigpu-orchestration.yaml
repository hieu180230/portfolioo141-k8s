---
# 1. BỘ NÃO AI (Deployment)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiny-ai-engine
  namespace: default
  labels:
    app: tiny-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tiny-ai
  template:
    metadata:
      labels:
        app: tiny-ai
    spec:
      volumes:
        - name: brain-storage
          emptyDir: {}
      initContainers:
        - name: model-downloader
          image: curlimages/curl:latest
          command: ['/bin/sh', '-c']
          args:
            - curl -L https://huggingface.co/Qwen/Qwen2-0.5B-Instruct-GGUF/resolve/main/qwen2-0_5b-instruct-q4_0.gguf -o /models/tiny-model.gguf
          volumeMounts:
            - name: brain-storage
              mountPath: /models
      containers:
        - name: llama-cpp-server
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - '-m'
            - '/models/tiny-model.gguf'
            - '--host'
            - '0.0.0.0'
            - '--port'
            - '8080'
            - '-c'
            - '1024'
            - '-t'
            - '2'
            - '--metrics' # Đã bật công tắc xả lũ dữ liệu
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: brain-storage
              mountPath: /models
          resources:
            requests:
              cpu: '100m'
              memory: '512Mi'
            limits:
              cpu: '2'
              memory: '1Gi'
              nvidia.com/gpu: '1'

---
# 2. CÁI VAN XẢ (Service) - Đã được vá cổng 8080 và dán nhãn
apiVersion: v1
kind: Service
metadata:
  name: tiny-ai-service
  namespace: default
  labels:
    app: tiny-ai
spec:
  selector:
    app: tiny-ai
  ports:
    - name: metrics-port # Tên này để Prometheus ngửi thấy
      protocol: TCP
      port: 8080 # Mở thẳng cổng 8080
      targetPort: 8080
  type: ClusterIP

---
# 3. SỢI DÂY TRÓI HỒN (ServiceMonitor)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tiny-ai-monitor
  namespace: default
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: tiny-ai
  endpoints:
    - port: metrics-port
      path: /metrics
      interval: 10s
